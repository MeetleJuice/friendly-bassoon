name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Promote the exact installer from this successful main-branch run; blank runs all build gates'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.verified_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and development dependencies
        timeout-minutes: 6
        run: python -m pip install -e ".[dev]" "pyinstaller==6.16.0"
      - name: Validate tests and code
        id: tests
        # Measured 0.20 Windows runs advanced from528 to1045+checks after
        # report-redaction optimization but exhausted12minutes without assertions.
        # Keep all checks and bounded breadcrumbs; allow the remaining workload.
        timeout-minutes: 18
        env:
          QT_QPA_PLATFORM: offscreen
          AIGENTICS_CI_PROGRESS: .ci-active-test.txt
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -u -m pytest -q --junitxml=test-results.xml 2>&1 | Tee-Object -FilePath ci-test-output.txt
          $testExitCode = $LASTEXITCODE
          "$testExitCode" | Set-Content .ci-test-exit.txt
          if ($testExitCode -ne 0) {
            $lastTest = if (Test-Path .ci-active-test.txt) { (Get-Content .ci-active-test.txt -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A') } else { 'unknown' }
            Write-Output "::error title=Python test process::Exit code $testExitCode; last started test: $lastTest"
            if (Test-Path test-results.xml) { python scripts/report_test_failures.py test-results.xml }
            throw 'Tests failed; inspect the individual failure annotations'
          }
          python -m ruff check aigentics tests scripts
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed' }
      - name: Record test phase outcome
        if: always()
        run: |
          Write-Output "::notice title=Test phase::Outcome ${{ steps.tests.outcome }}"
          if (Test-Path .ci-test-exit.txt) {
            $processExit = (Get-Content .ci-test-exit.txt -Raw).Trim()
            Write-Output "::notice title=Python test exit code::$processExit"
          }
          if ('${{ steps.tests.outcome }}' -ne 'success' -and (Test-Path ci-test-output.txt)) {
            $tail = (Get-Content ci-test-output.txt -Tail 35) -join "`n"
            if ($tail.Length -gt 6000) { $tail = $tail.Substring($tail.Length - 6000) }
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Test output tail::$tail"
          }
          if ('${{ steps.tests.outcome }}' -ne 'success' -and (Test-Path .ci-active-test.txt)) {
            $lastTest = (Get-Content .ci-active-test.txt -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Last started test::$lastTest"
          }
      - name: Determine version and validate tag
        id: version
        run: |
          $version = (python -c "from aigentics import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read version' }
          $declared = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($version -ne $declared) { throw 'Package versions disagree' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Ensure Inno Setup is available
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build standalone executable and installer
        id: package
        timeout-minutes: 10
        run: |
          try { ./scripts/build_windows.ps1 -Version '${{ steps.version.outputs.version }}' }
          catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows package build::$detail"
            throw
          }
      - name: Verify actual installer and desktop shortcut
        id: installer
        timeout-minutes: 6
        run: |
          try { ./scripts/smoke_windows.ps1 -Version '${{ steps.version.outputs.version }}' }
          catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer verification::$detail"
            throw
          }
      - name: Record installer phase outcomes
        if: always()
        run: |
          Write-Output "::notice title=Package phase::Outcome ${{ steps.package.outcome }}"
          Write-Output "::notice title=Installer phase::Outcome ${{ steps.installer.outcome }}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Aigentics-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/installer/Aigentics-Setup-*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload setup logs if the build fails
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Windows-setup-diagnostics
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/aigentics-setup.log
            build/Aigentics/warn-Aigentics.txt
            test-results.xml
            ci-test-output.txt
            .ci-test-exit.txt
            .ci-active-test.txt
          if-no-files-found: ignore

  publish:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.verified_run_id != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify successful source and immutable artifact provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" > source-artifacts.json
          python scripts/release_provenance.py source source-run.json source-artifacts.json "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          clean: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Aigentics-Windows-${{ steps.source.outputs.version }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id }}
      - name: Verify exact installer and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python scripts/release_provenance.py verify release
          python -c 'import os,tomllib; assert tomllib.load(open("pyproject.toml","rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing to overwrite it'; exit 1
          fi
          gh release create "v$RELEASE_VERSION" release/Aigentics-Setup-*.exe release/SHA256SUMS.txt release/BUILD_PROVENANCE.json \
            --target "$SOURCE_SHA" --title "Aigentics Desktop v$RELEASE_VERSION" --notes-file docs/RELEASE_NOTES.md
