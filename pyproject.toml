[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aigentics-desktop"
version = "0.9.0"
description = "Local-first desktop coding agents with observable execution"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.8.3", "httpx==0.28.1", "pydantic==2.11.7", "keyring==25.6.0", "python-dotenv==1.1.1", "pathspec==0.12.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-qt==4.5.0", "ruff==0.12.5"]

[project.scripts]
aigentics = "aigentics.ui:main"

[tool.setuptools.packages.find]
include = ["aigentics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
aigentics = ["assets/*.ico", "assets/*.svg"]
