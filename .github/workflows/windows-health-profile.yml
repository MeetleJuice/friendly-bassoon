name: Windows offline health profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: d398635a22eb2d2307f0f7d65ead7bf3cbf01998
          path: baseline0190
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Compare offline fixture costs with the published baseline
        timeout-minutes: 6
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/profile_health.py --source-root baseline0190
          if ($LASTEXITCODE -ne 0) { throw 'Baseline health failed' }
          python scripts/profile_health.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate health failed' }
          python scripts/profile_health.py --memory-proof
          if ($LASTEXITCODE -ne 0) { throw 'Candidate in-memory proof comparison failed' }
